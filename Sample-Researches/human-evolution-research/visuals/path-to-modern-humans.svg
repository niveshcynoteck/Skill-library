<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .title { font: 700 46px sans-serif; fill: #17202a; }
      .subtitle { font: 24px sans-serif; fill: #4d5656; }
      .label { font: 700 24px sans-serif; fill: #17202a; }
      .small { font: 20px sans-serif; fill: #34495e; }
      .tiny { font: 17px sans-serif; fill: #566573; }
      .main { fill: #d6eaf8; stroke: #2471a3; stroke-width: 4; }
      .modern { fill: #d5f5e3; stroke: #1e8449; stroke-width: 5; }
      .branch { fill: #fce4d6; stroke: #ca6f1e; stroke-width: 4; }
      .uncertain { fill: #f9e79f; stroke: #b7950b; stroke-width: 4; stroke-dasharray: 12 8; }
      .line { fill: none; stroke: #2471a3; stroke-width: 7; }
      .side-line { fill: none; stroke: #ca6f1e; stroke-width: 5; }
      .gene { fill: none; stroke: #8e44ad; stroke-width: 5; stroke-dasharray: 12 9; }
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2471a3"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ca6f1e"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8e44ad"/></marker>
  </defs>

  <rect width="1800" height="1200" fill="#fbfcfc"/>
  <text x="900" y="68" text-anchor="middle" class="title">A Cautious Path to Living Humans</text>
  <text x="900" y="108" text-anchor="middle" class="subtitle">A branching population history, not a ladder of inevitable progress</text>

  <path class="line" marker-end="url(#arrow-blue)" d="M250 220 L535 220"/>
  <path class="line" marker-end="url(#arrow-blue)" d="M735 220 L1010 220"/>
  <path class="line" marker-end="url(#arrow-blue)" d="M1210 220 L1510 220"/>
  <path class="line" marker-end="url(#arrow-blue)" d="M1610 285 L1610 440"/>
  <path class="line" marker-end="url(#arrow-blue)" d="M1510 520 L1240 520"/>
  <path class="line" marker-end="url(#arrow-blue)" d="M1040 520 L760 520"/>
  <path class="line" marker-end="url(#arrow-blue)" d="M560 520 L280 520"/>
  <path class="line" marker-end="url(#arrow-blue)" d="M180 595 L180 790"/>

  <rect x="50" y="160" rx="20" width="200" height="120" class="uncertain"/>
  <text x="150" y="203" text-anchor="middle" class="label">Human–Pan</text>
  <text x="150" y="236" text-anchor="middle" class="small">common ancestor</text>
  <text x="150" y="264" text-anchor="middle" class="tiny">about 7–6 Ma</text>

  <rect x="535" y="160" rx="20" width="200" height="120" class="uncertain"/>
  <text x="635" y="200" text-anchor="middle" class="label">Early possible</text>
  <text x="635" y="231" text-anchor="middle" class="small">hominins</text>
  <text x="635" y="260" text-anchor="middle" class="tiny">7–4.4 Ma</text>

  <rect x="1010" y="160" rx="20" width="200" height="120" class="main"/>
  <text x="1110" y="202" text-anchor="middle" class="label">Australopith</text>
  <text x="1110" y="233" text-anchor="middle" class="small">populations</text>
  <text x="1110" y="262" text-anchor="middle" class="tiny">4.2–2 Ma</text>

  <rect x="1510" y="160" rx="20" width="200" height="125" class="uncertain"/>
  <text x="1610" y="200" text-anchor="middle" class="label">Origin of Homo</text>
  <text x="1610" y="233" text-anchor="middle" class="small">unresolved transition</text>
  <text x="1610" y="263" text-anchor="middle" class="tiny">by about 2.8 Ma</text>

  <rect x="1510" y="440" rx="20" width="200" height="155" class="main"/>
  <text x="1610" y="482" text-anchor="middle" class="label">Early Homo</text>
  <text x="1610" y="516" text-anchor="middle" class="small">habilis / rudolfensis</text>
  <text x="1610" y="549" text-anchor="middle" class="tiny">relationships disputed</text>
  <text x="1610" y="578" text-anchor="middle" class="tiny">about 2.4–1.4 Ma</text>

  <rect x="1040" y="440" rx="20" width="200" height="155" class="main"/>
  <text x="1140" y="482" text-anchor="middle" class="label">H. erectus-grade</text>
  <text x="1140" y="516" text-anchor="middle" class="small">African populations</text>
  <text x="1140" y="549" text-anchor="middle" class="tiny">strong broad candidate</text>
  <text x="1140" y="578" text-anchor="middle" class="tiny">from about 1.9 Ma</text>

  <rect x="560" y="440" rx="20" width="200" height="155" class="uncertain"/>
  <text x="660" y="481" text-anchor="middle" class="label">Middle Pleistocene</text>
  <text x="660" y="514" text-anchor="middle" class="small">African Homo</text>
  <text x="660" y="547" text-anchor="middle" class="tiny">taxonomy unresolved</text>
  <text x="660" y="576" text-anchor="middle" class="tiny">about 700–300 ka</text>

  <rect x="80" y="440" rx="20" width="200" height="155" class="modern"/>
  <text x="180" y="482" text-anchor="middle" class="label">Homo sapiens</text>
  <text x="180" y="515" text-anchor="middle" class="small">structured African origin</text>
  <text x="180" y="548" text-anchor="middle" class="tiny">from about 300 ka</text>
  <text x="180" y="577" text-anchor="middle" class="tiny">not one precise birthplace</text>

  <rect x="70" y="790" rx="22" width="220" height="130" class="modern"/>
  <text x="180" y="837" text-anchor="middle" class="label">Living humans</text>
  <text x="180" y="872" text-anchor="middle" class="small">Homo sapiens</text>
  <text x="180" y="902" text-anchor="middle" class="tiny">Africa + global dispersals</text>

  <path class="side-line" marker-end="url(#arrow-orange)" d="M1110 280 C1110 335 1320 320 1370 365"/>
  <rect x="1270" y="350" rx="18" width="260" height="85" class="branch"/>
  <text x="1400" y="385" text-anchor="middle" class="label">Paranthropus</text>
  <text x="1400" y="416" text-anchor="middle" class="tiny">specialized side radiation</text>

  <path class="side-line" marker-end="url(#arrow-orange)" d="M660 595 C660 680 900 660 955 725"/>
  <rect x="850" y="710" rx="18" width="250" height="100" class="branch"/>
  <text x="975" y="750" text-anchor="middle" class="label">Other branches</text>
  <text x="975" y="780" text-anchor="middle" class="tiny">H. naledi, floresiensis,</text>
  <text x="975" y="801" text-anchor="middle" class="tiny">luzonensis and others</text>

  <path class="side-line" marker-end="url(#arrow-orange)" d="M660 595 C650 720 530 735 500 820"/>
  <rect x="350" y="810" rx="18" width="300" height="115" class="branch"/>
  <text x="500" y="850" text-anchor="middle" class="label">Neanderthals</text>
  <text x="500" y="881" text-anchor="middle" class="small">and Denisovans</text>
  <text x="500" y="910" text-anchor="middle" class="tiny">Eurasian sister lineages</text>

  <path class="gene" marker-end="url(#arrow-purple)" d="M350 865 C310 760 255 750 235 700"/>
  <text x="400" y="735" class="small" fill="#8e44ad">later gene flow</text>

  <rect x="70" y="1010" width="1660" height="130" rx="18" fill="#f4f6f7" stroke="#aab7b8" stroke-width="2"/>
  <text x="100" y="1048" class="label">How to read this diagram</text>
  <text x="100" y="1082" class="small">Blue: cautious population-level pathway. Yellow dashed: uncertain transition. Orange: side branch.</text>
  <text x="100" y="1114" class="small">Purple dashed: interbreeding, not direct descent. Dates are approximate and do not prove parent–offspring ancestry.</text>
</svg>
