<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 30px; font-weight: 700; fill: #1a1a2e; }
    .subtitle { font-size: 15px; fill: #555; }
    .col-header { font-size: 20px; font-weight: 700; fill: #ffffff; }
    .row-label { font-size: 13px; font-weight: 700; fill: #6b7280; letter-spacing: 0.5px; }
    .body-text { font-size: 14px; fill: #1f2937; }
    .body-text-sm { font-size: 12.5px; fill: #374151; }
    .badge { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect x="0" y="0" width="1400" height="900" fill="#f7f7fb"/>

  <text x="700" y="42" text-anchor="middle" class="title">Stock Market Movers: 2010s vs 2020s vs 2030s</text>
  <text x="700" y="66" text-anchor="middle" class="subtitle">Historical drivers of the last two decades, compared with analyst projections for the next</text>

  <!-- Column headers -->
  <rect x="40" y="90" width="420" height="50" rx="8" fill="#1e3a5f"/>
  <text x="250" y="122" text-anchor="middle" class="col-header">2010s (Actual)</text>

  <rect x="480" y="90" width="420" height="50" rx="8" fill="#0f766e"/>
  <text x="690" y="122" text-anchor="middle" class="col-header">2020s (2020–2026, Actual)</text>

  <rect x="920" y="90" width="440" height="50" rx="8" fill="#7c3aed" stroke="#7c3aed" stroke-dasharray="0"/>
  <text x="1140" y="122" text-anchor="middle" class="col-header">2030s (Projected)</text>
  <rect x="920" y="90" width="440" height="50" rx="8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- PROJECTED badge -->
  <rect x="1225" y="97" width="125" height="22" rx="11" fill="#fbbf24"/>
  <text x="1287" y="112" text-anchor="middle" class="badge" fill="#1a1a2e">NOT GUARANTEED</text>

  <!-- Column background boxes (dashed for 2030s) -->
  <rect x="40" y="150" width="420" height="700" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="480" y="150" width="420" height="700" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="920" y="150" width="440" height="700" rx="10" fill="#faf5ff" stroke="#a78bfa" stroke-width="2" stroke-dasharray="10,6"/>

  <!-- Row: Dominant Theme -->
  <text x="60" y="180" class="row-label">DOMINANT THEME</text>
  <text x="60" y="204" class="body-text" font-weight="600">Post-crisis recovery &amp;</text>
  <text x="60" y="224" class="body-text" font-weight="600">the FAANG era</text>

  <text x="500" y="180" class="row-label">DOMINANT THEME</text>
  <text x="500" y="204" class="body-text" font-weight="600">COVID shock, inflation</text>
  <text x="500" y="224" class="body-text" font-weight="600">shock, then the AI boom</text>

  <text x="940" y="180" class="row-label">DOMINANT THEME (forecast)</text>
  <text x="940" y="204" class="body-text" font-weight="600">AI productivity diffusion +</text>
  <text x="940" y="224" class="body-text" font-weight="600">demographic &amp; energy shifts</text>

  <line x1="60" y1="242" x2="440" y2="242" stroke="#eef0f4" stroke-width="1.5"/>
  <line x1="500" y1="242" x2="880" y2="242" stroke="#eef0f4" stroke-width="1.5"/>
  <line x1="940" y1="242" x2="1340" y2="242" stroke="#c4b5fd" stroke-width="1.5"/>

  <!-- Row: Top Movers -->
  <text x="60" y="266" class="row-label">TOP MARKET-MOVING COMPANIES</text>
  <text x="60" y="288" class="body-text-sm">Facebook, Amazon, Apple,</text>
  <text x="60" y="306" class="body-text-sm">Netflix, Google (FAANG)</text>
  <text x="60" y="326" class="body-text-sm" fill="#1e3a5f" font-weight="700">Tech sector: +401% cumulative</text>

  <text x="500" y="266" class="row-label">TOP MARKET-MOVING COMPANIES</text>
  <text x="500" y="288" class="body-text-sm">"Magnificent Seven": Nvidia,</text>
  <text x="500" y="306" class="body-text-sm">Apple, Microsoft, Alphabet,</text>
  <text x="500" y="324" class="body-text-sm">Amazon, Meta, Tesla</text>
  <text x="500" y="344" class="body-text-sm" fill="#0f766e" font-weight="700">Top 10 = ~40% of S&amp;P 500 (was 22% in 2020)</text>

  <text x="940" y="266" class="row-label">TOP MOVERS (projected)</text>
  <text x="940" y="288" class="body-text-sm">Broadening beyond Mag 7 as AI</text>
  <text x="940" y="306" class="body-text-sm">shifts "adoption → deployment"</text>
  <text x="940" y="324" class="body-text-sm">across sectors (JPMorgan);</text>
  <text x="940" y="342" class="body-text-sm">power/nuclear infrastructure tied</text>
  <text x="940" y="360" class="body-text-sm">to AI data-center demand</text>

  <line x1="60" y1="378" x2="440" y2="378" stroke="#eef0f4" stroke-width="1.5"/>
  <line x1="500" y1="378" x2="880" y2="378" stroke="#eef0f4" stroke-width="1.5"/>
  <line x1="940" y1="378" x2="1340" y2="378" stroke="#c4b5fd" stroke-width="1.5"/>

  <!-- Row: Macro Backdrop -->
  <text x="60" y="402" class="row-label">MACRO BACKDROP</text>
  <text x="60" y="424" class="body-text-sm">Fed rates near-zero 2008–2015;</text>
  <text x="60" y="442" class="body-text-sm">Quantitative Easing (QE1–3);</text>
  <text x="60" y="460" class="body-text-sm">Fed balance sheet $882B → $4.5T</text>

  <text x="500" y="402" class="row-label">MACRO BACKDROP</text>
  <text x="500" y="424" class="body-text-sm">COVID crash &amp; stimulus (2020);</text>
  <text x="500" y="442" class="body-text-sm">40-yr-high inflation &amp; Fed hikes</text>
  <text x="500" y="460" class="body-text-sm">(2022); AI capex supercycle</text>
  <text x="500" y="478" class="body-text-sm" fill="#0f766e" font-weight="700">~$527B Mag7 AI/data-center capex (FY2026 est.)</text>

  <text x="940" y="402" class="row-label">MACRO BACKDROP (forecast)</text>
  <text x="940" y="424" class="body-text-sm">Goldman Sachs: S&amp;P 500 ~9,000</text>
  <text x="940" y="442" class="body-text-sm">by 2030, 6.5% annualized return</text>
  <text x="940" y="460" class="body-text-sm">(range 3%–10%)</text>
  <text x="940" y="480" class="body-text-sm">JPMorgan: 6.7% annualized for US</text>
  <text x="940" y="498" class="body-text-sm">large caps over next 10–15 yrs</text>

  <line x1="60" y1="496" x2="440" y2="496" stroke="#eef0f4" stroke-width="1.5"/>
  <line x1="500" y1="512" x2="880" y2="512" stroke="#eef0f4" stroke-width="1.5"/>
  <line x1="940" y1="516" x2="1340" y2="516" stroke="#c4b5fd" stroke-width="1.5"/>

  <!-- Row: S&P 500 Return Character -->
  <text x="60" y="520" class="row-label">S&amp;P 500 RETURN CHARACTER</text>
  <text x="60" y="542" class="body-text-sm">+300–400% over the decade</text>
  <text x="60" y="560" class="body-text-sm">(~676 in Mar 2009 → ~3,386 by</text>
  <text x="60" y="578" class="body-text-sm">Feb 2020); near-uninterrupted</text>
  <text x="60" y="596" class="body-text-sm">bull market</text>

  <text x="500" y="536" class="row-label">S&amp;P 500 RETURN CHARACTER</text>
  <text x="500" y="558" class="body-text-sm">Sharp COVID crash → V-shaped</text>
  <text x="500" y="576" class="body-text-sm">recovery; 2022 bear market; then</text>
  <text x="500" y="594" class="body-text-sm">AI-fueled rally 2023–2026 —</text>
  <text x="500" y="612" class="body-text-sm">narrow &amp; concentrated</text>

  <text x="940" y="540" class="row-label">S&amp;P 500 RETURN CHARACTER (forecast)</text>
  <text x="940" y="562" class="body-text-sm">Lower expected annual returns</text>
  <text x="940" y="580" class="body-text-sm">than 2010s/2020s, due to high</text>
  <text x="940" y="598" class="body-text-sm">starting valuations &amp; market</text>
  <text x="940" y="616" class="body-text-sm">concentration; wide uncertainty</text>
  <text x="940" y="634" class="body-text-sm">band around every forecast</text>

  <line x1="60" y1="614" x2="440" y2="614" stroke="#eef0f4" stroke-width="1.5"/>
  <line x1="500" y1="630" x2="880" y2="630" stroke="#eef0f4" stroke-width="1.5"/>
  <line x1="940" y1="652" x2="1340" y2="652" stroke="#c4b5fd" stroke-width="1.5"/>

  <!-- Row: Key Risk -->
  <text x="60" y="638" class="row-label">KEY RISK</text>
  <text x="60" y="660" class="body-text-sm">Gains concentrated among the</text>
  <text x="60" y="678" class="body-text-sm">wealthy (bottom 50% owned</text>
  <text x="60" y="696" class="body-text-sm">~0.5% of equities); ended in the</text>
  <text x="60" y="714" class="body-text-sm">COVID crash, Feb–Mar 2020</text>

  <text x="500" y="654" class="row-label">KEY RISK</text>
  <text x="500" y="676" class="body-text-sm">Extreme concentration in a</text>
  <text x="500" y="694" class="body-text-sm">handful of AI-linked mega-caps;</text>
  <text x="500" y="712" class="body-text-sm">AI-bubble concerns; US–China</text>
  <text x="500" y="730" class="body-text-sm">geopolitical tension</text>

  <text x="940" y="676" class="row-label">KEY RISK (this is a forecast, not a fact)</text>
  <text x="940" y="698" class="body-text-sm">Falling fertility &amp; aging</text>
  <text x="940" y="716" class="body-text-sm">populations (McKinsey); still-high</text>
  <text x="940" y="734" class="body-text-sm">equity valuations; AI-capex</text>
  <text x="940" y="752" class="body-text-sm">spending sustainability unproven</text>

  <!-- Bottom banner -->
  <rect x="40" y="800" width="1320" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="700" y="826" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">⚠ The 2010s and 2020s columns are historical fact. The 2030s column is composed entirely of analyst forecasts</text>
  <text x="700" y="846" text-anchor="middle" font-size="13.5" fill="#92400e">(Goldman Sachs, JPMorgan, McKinsey) — these are estimates with wide error bands, not guaranteed outcomes.</text>
</svg>
